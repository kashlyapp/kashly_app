name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Flutter version
        run: flutter --version

      # Dependències
      - name: Pub get
        run: flutter pub get

      # Analyzer lleuger per evitar problemes de plugins
      - name: Analyze
        run: flutter analyze

      - name: Test with coverage (lcov)
        run: |
          flutter test --coverage --coverage-path coverage/lcov.info
          ls -lah coverage || true

      # DEBUG: imprimeix capçaleres LCOV i fitxers sota lib/
      - name: Debug coverage headers & lib listing
        if: always()
        shell: bash
        run: |
          echo "== LIB files (tracked) =="
          git ls-files 'lib/**/*.dart' | sed 's/^/LIB: /' || true
          echo ""
          echo "== lcov.info head (first 80 lines) =="
          if [ -f coverage/lcov.info ]; then head -n 80 coverage/lcov.info; else echo "coverage/lcov.info NOT FOUND"; fi
          echo ""
          echo "== SF lines under lib/ (first 50) =="
          if [ -f coverage/lcov.info ]; then awk -F':' '/^SF:/ && $2 ~ /\/lib\// {print $0}' coverage/lcov.info | head -n 50; fi

      # ENFORCEMENT: càlcul robust directament sobre lcov.info, sense lcov --remove
      - name: Enforce coverage >= 70% (AWK over lib/)
        shell: bash
        run: |
          set -euo pipefail
          FILE="coverage/lcov.info"
          THRESHOLD=70
          if [ ! -f "$FILE" ]; then
            echo "Error: $FILE not found"; exit 1
          fi

          awk -v threshold="$THRESHOLD" '
            BEGIN{in_lib=0; total=0; covered=0; files=0}
            # SF:<path>
            /^SF:/ {
              path = substr($0,4)
              # Inclou només fitxers sota lib/ i exclou *.g.dart i firebase_options.dart
              in_lib = (path ~ /\/lib\//) && !(path ~ /\.g\.dart$/) && !(path ~ /\/firebase_options\.dart$/)
              if (in_lib) files++
              next
            }
            # DA:<line>,<hits>
            in_lib && /^DA:/ {
              split($0,a,":"); split(a[2],b,",")
              total++
              if (b[2] + 0 > 0) covered++
              next
            }
            END{
              if (files==0 || total==0){
                print "No SF under lib/ (after exclusions) or no DA lines."
                exit 2
              }
              pct = (covered*100.0)/total
              printf("Line coverage: %.2f%% (%d/%d)\n", pct, covered, total)
              if (pct + 0 < threshold){ exit 3 } else { exit 0 }
            }
          ' "$FILE" \
          || {
            code=$?
            if [ $code -eq 2 ]; then
              echo "No SF under lib/"
            elif [ $code -eq 3 ]; then
              echo "Coverage below threshold"
            fi
            exit $code
          }
