          echo "=== First 40 lines of $LCOV ==="
          sed -n '1,40p' "$LCOV" || true
          echo "=== SF entries under lib/ (first 80) ==="
          grep -n '^SF:' "$LCOV" | sed -n '1,80p' || true
          echo "=== SF entries under lib/utils/ ==="
          grep -n '^SF:.*lib/utils/' "$LCOV" || true

      # Filtra cobertura a lib/ i exclou generats
      - name: Filter coverage to lib
        shell: bash
        run: |
          set -euo pipefail
          LCOV="coverage/lcov.info"
          if [ ! -f "$LCOV" ]; then
            echo "::error::Missing $LCOV"
            exit 1
          fi
          # Mantén només fitxers de lib/
          lcov --extract "$LCOV" "$(pwd)/lib/*" "$(pwd)/lib/**" -o "$LCOV"
          # Exclou generats i firebase_options
          lcov --remove "$LCOV" "$(pwd)/lib/**.g.dart" "$(pwd)/lib/firebase_options.dart" -o "$LCOV" || true
          echo "=== Summary after extract/remove ==="
          lcov --summary "$LCOV" || true

